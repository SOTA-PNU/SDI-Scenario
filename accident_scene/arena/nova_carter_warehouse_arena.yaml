# nova_carter_warehouse_arena.yaml — ACCIDENT ARENA: 모서리에서 모서리로, 숨은 위험물 사이를
#
# accident_scene 의 두 번째 장면이다. 첫 장면(../nova_carter_warehouse_accident.yaml)은 짧은
# 통로에 숨은 박스 하나였다. 이 장면은 **창고 전체**를 실험장으로 쓴다: 출발과 목표를 서로 반대편
# 모서리에 두고, 그 사이에 박스 14개를 깐다. base 러너는 levels_zero2level 의 디폴트(빈
# 컨트롤러)로 시작한다.
#
# ---------------------------------------------------------------------------
# 0. v2 (2026-10-08) — 박스 최소 높이 0.6 m
# ---------------------------------------------------------------------------
# 바꾼 것은 박스 04·05·06·13 의 height 하나뿐이다 (0.25·0.20·0.18·0.20 → 0.6 m).
# 위치·크기·출발·목표·판정·하네스·PROMPT 는 v1 과 같다.
# 기준: 로봇에서 가장 높은 라이다(XT32, z 0.526 m)보다 높게. 그러면 env.raycast_scan
# 기본 평면(0.35 m), 앞·뒤 2D 라이다 RPLIDAR S2E(0.418 m), XT32 높이의 수평 광선이 모든
# 박스에 맞는다. 실측: analysis/box_visibility_v1.log, analysis/box_visibility_v2.log.
# 실험 1–9 는 v1(낮은 박스 4개가 스캔 평면 아래)에서 했다. v1 원본은 env_v1/ 에 있다.
# 아래 2–4절은 v1 설계 기록이다(함정, 사전검증, 실측 모두 v1 기준).
#
# ---------------------------------------------------------------------------
# 1. 실험장 (이 호스트에서 실측)
# ---------------------------------------------------------------------------
# PhysX overlap_box 로 0.25 m 격자를 로봇 몸체 높이(z 0.05~0.55)에서 훑어 만든 지도 기준:
#   벽 안쪽 실험장   x ∈ [-10.2, 9.3], y ∈ [-12.2, 17.9]  (약 19.5 × 30 m)
#   서쪽 벽 선반     x ∈ [-10.0, -8.5], y ∈ [-4.0, 12.5]   (/World/warehouse_extras — 충돌 집계됨)
#   지게차 2대       Forklift_01 x[-9.59,-6.10] y[-3.45,-2.23], Forklift x[1.84,5.44] y[-3.43,-0.55]
#   북서쪽 팔레트    x ∈ [-7.2, -5.0], y ∈ [12.8, 14.5]
#   나머지는 빈 바닥. 벽 기둥이 양쪽 벽에서 y = 15, 9, 3, -3, -9 에 튀어나와 있다.
#
# ---------------------------------------------------------------------------
# 2. 배치 — 보이는 박스 10 개 + 안 보이는 박스 4 개
# ---------------------------------------------------------------------------
# 유일한 외부 감각인 env.raycast_scan() 은 z = 0.35 m 고정 평면이다(첫 장면과 같은 원리).
#
# 아래의 "회피 컨트롤러"는 설계 검증용 참조 — 기본 스캔만 쓰는 levels/level3 solution 의
# 반응형 회피기 — 이고, base 가 아니다.
#
#   슬라럼 상자 3개 (1.0 m)   대각선 위에 좌우로 엇갈려 놓아 대각선 직진을 막는다.
#                             회피 컨트롤러는 각 상자를 약 0.19 m 차체 여유로 스쳐 지난다(2D 사전검증).
#   팔레트 벽 (5.0 × 0.8 × 1.0 m, x[-2, 3] y[3.8, 4.6])
#                             목표 방향을 정면으로 막는다. 벽을 보면 동쪽 끝으로 우회하게 된다.
#   TRAP 1 (0.25 m)           그 우회로에, 벽 동쪽 끝 바로 아래 숨어 있다.   ← 회피 컨트롤러가 여기서 박힌다
#   TRAP 2 (0.20 m)           벽을 동쪽으로 연장한다. TRAP 1 을 피해도 여기서 막히게.
#   TRAP 3 (0.18 m)           목표 직전, 동쪽 벽에 붙여 모든 직선 최종 접근을 가로지른다.
#                             서쪽 끝이 열려 있어 그쪽이 깨끗한 경로다.
#   팔레트 더미 7개           경로 주변 잡동사니 (6개 1.0 m, 1개 0.20 m).
#
# 세 개의 함정이 겹겹이 깔려 있어 사고가 "5 cm 우연"에 걸려 있지 않다. 2D 사전검증에서 출발
# 자세 ±8 cm/±0.05 rad, 모든 박스 ±10 cm, 기동 지연 0~0.3 s, 명령 지연 1~4 프레임, 가속 한계
# ×0.7~1.3 으로 흔든 60회가 전부 TRAP 1 에서 충돌했다(t = 23.4 ~ 24.8 s).
#
# ---------------------------------------------------------------------------
# 3. 실측 (2026-09-11, fractal, 드라이버 580.173.02, 원본 하네스)
# ---------------------------------------------------------------------------
#   base (levels_zero2level 디폴트 [EDIT REGION] — 제어 코드 없음):
#     verdict=fail (TIMEOUT 120 s), collision_count=0, final_dist=32.03 m
#     로봇이 출발 모서리에서 주행하지 않는다(0 명령 크리프 1.06 mm/s, 120 s 에 0.126 m). 출발점이다.
#
#   설계 검증 — 참조 회피 컨트롤러(위 2절):
#     verdict=fail, collision_count=360, partner=/World/arena_box_04 (TRAP 1),
#     first_collision_t=23.933 s, final_dist=14.503 m
#   2회 반복이 소수점까지 동일했다. 2D 예측(첫 충돌 24.0 s, 같은 박스)과도 일치한다.
#
# ---------------------------------------------------------------------------
# 4. 이 장면을 어떻게 통과하는가
# ---------------------------------------------------------------------------
# 경로는 열려 있다: 여유 0.6 m 로 A* 한 경로 길이 34.7 m, 가장 좁은 통로 3.2 m, 1.2 m 미만의
# 틈은 없다. 첫 장면과 같은 처방 — 스캔을 낮은 평면에서 쏘는 것 — 이 여기서도 통한다.
# 2D 사전검증: 참조 회피 컨트롤러에서 z=0.15 로만 바꿔도 통과(ttg 51.5 s), 첫 장면의 3줄 수정
# (z 0.15, BLOCK_RANGE 3.0, SIDE_MARGIN 0.95) 이면 통과(ttg 44.2 s, 최소 여유 0.41 m).
#
# ---------------------------------------------------------------------------
# 5. 표준 스키마를 넘어서는 두 가지
# ---------------------------------------------------------------------------
# cv-infra 계약은 시작 자세를 지정할 수 없고(항상 AMCL 시작 pose), debug_obstacle 이 단수다
# (README "스키마 한계"). 이 장면은 둘 다 필요해서, 러너가 arena_harness.ArenaHarness 로
# levels/common/carter_env.py 를 **수정하지 않고** 확장한다:
#   start_pose        물리 시작 전에 로봇 루트를 옮긴다. 실측: 부팅 후 GT 자세가 요청값과 정확히 같다.
#   debug_obstacles   (복수) 정적 박스 N 개. 경로 /World/arena_box_NN 은 제외 목록에 없으므로
#                     레벨들의 /World/debug_obstacle 과 똑같이 충돌로 집계된다.
#
# EXPECTED = fail, exit 1  (base = 빈 컨트롤러라 TIMEOUT 으로 실패. 실측 확인)

apiVersion: cv-infra/v1

scenario:
  scene: nova_carter_warehouse
  robot: nova_carter
  start_pose:                            # 확장 (표준 스키마에 없음) — 남서 모서리
    x: -9.0
    y: -10.8
    yaw: 1.0138                          # 목표를 향한 대각선
    frame: map
  goal:                                  # 북동 모서리
    x: 8.0
    y: 16.5
    yaw: 1.0138
    frame: map
  seed: 42
  timeout_s: 120
  debug_obstacles:                       # 확장 (표준은 단수 debug_obstacle) — 14 개
    - {x: -6.96, y: -6.77, width: 1.0, depth: 1.0, height: 1.0}    # 00 슬라럼 상자 1
    - {x: -2.35, y: -2.57, width: 1.0, depth: 1.0, height: 1.0}    # 01 슬라럼 상자 2
    - {x: -2.29, y: 0.92, width: 1.0, depth: 1.0, height: 1.0}     # 02 슬라럼 상자 3
    - {x: 0.5, y: 4.2, width: 5.0, depth: 0.8, height: 1.0}        # 03 팔레트 벽 x[-2,3]
    - {x: 2.5, y: 3.0, width: 1.0, depth: 1.6, height: 0.6}        # 04 v1 0.25 m (TRAP 1)
    - {x: 3.9, y: 4.2, width: 1.8, depth: 0.8, height: 0.6}        # 05 v1 0.20 m (TRAP 2)
    - {x: 7.625, y: 13.4, width: 3.25, depth: 1.0, height: 0.6}    # 06 v1 0.18 m (TRAP 3)
    - {x: 1.8, y: 9.0, width: 1.0, depth: 1.0, height: 1.0}        # 07 팔레트 더미
    - {x: 3.4, y: 13.0, width: 1.0, depth: 1.0, height: 1.0}       # 08 팔레트 더미
    - {x: -4.5, y: 7.5, width: 1.2, depth: 1.0, height: 1.0}       # 09 팔레트 더미
    - {x: -1.5, y: 11.5, width: 1.0, depth: 1.2, height: 1.0}      # 10 팔레트 더미
    - {x: 3.0, y: -7.6, width: 1.2, depth: 1.0, height: 1.0}       # 11 팔레트 더미
    - {x: 6.6, y: -9.4, width: 1.0, depth: 1.0, height: 1.0}       # 12 팔레트 더미
    - {x: 0.2, y: -9.6, width: 1.2, depth: 0.8, height: 0.6}       # 13 v1 0.20 m 팔레트 (경로 밖)

sut:
  image_ref: carter-sut:p2

interface:
  type: ros2
  adapter_config:                        # 정본과 완전히 동일
    ros_distro: jazzy
    rmw: rmw_fastrtps_cpp
    use_sim_time: true
    goal_interface:
      kind: action
      name: /navigate_to_pose
      type: nav2_msgs/action/NavigateToPose
    cmd_vel:
      topic: /cmd_vel
      type: geometry_msgs/msg/Twist
    clock_topic: /clock
    odom_topics:
      - /odom
      - /chassis/odom
    sensors:
      - topic: /front_3d_lidar/lidar_points
        type: sensor_msgs/msg/PointCloud2
        frame: front_3d_lidar
      - topic: /front_2d_lidar/scan
        type: sensor_msgs/msg/LaserScan
        frame: front_2d_lidar
      - topic: /back_2d_lidar/scan
        type: sensor_msgs/msg/LaserScan
        frame: back_2d_lidar
    frames:
      map: map
      odom: odom
      base_link: base_link
    readiness:
      is_active_service: /lifecycle_manager_navigation/is_active

acceptance_criteria:                     # L1-L3 와 동일한 판정식
  - oracle: reached_goal
    params:
      position_tolerance_m: 0.75
      yaw_tolerance_rad: 0.26
      goal_orientation_wxyz: [0.8743, 0.0, 0.0, 0.4855]   # yaw 1.0138
  - oracle: no_collision                 # 모든 arena 박스, 지게차, 서쪽 선반이 집계된다
    params:
      chassis_path: /World/Nova_Carter_ROS/chassis_link
      collision_excluded_paths:
        - /World/Nova_Carter_ROS
        - /World/warehouse_with_forklifts/GroundPlane
        - /World/warehouse_with_forklifts/Warehouse_Empty_small_realtime
