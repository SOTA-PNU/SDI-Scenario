<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 224" width="460" height="224"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif" role="img"
     aria-label="스캔 평면 단면도: z=0.35 m 레이 팬이 높이 0.18~0.25 m 박스 위를 지나가고 높이 1.0 m 박스에서 멈춘다">
  <title>스캔 평면 단면 — 저평면 장애물이 센서에 잡히지 않는 이유</title>

  <!-- vertical scale: 1.0 m = 90 px, ground at y=180. horizontal: 1 m = 50 px -->
  <rect x="0" y="0" width="460" height="224" fill="#ffffff"/>

  <!-- z axis -->
  <line x1="34" y1="180" x2="34" y2="70" stroke="#101820" stroke-width="1"/>
  <g stroke="#101820" stroke-width="1">
    <line x1="30" y1="180" x2="34" y2="180"/>
    <line x1="30" y1="163.8" x2="34" y2="163.8"/>
    <line x1="30" y1="148.5" x2="34" y2="148.5"/>
    <line x1="30" y1="90" x2="34" y2="90"/>
  </g>
  <g font-size="9" fill="#5A6A79" text-anchor="end">
    <text x="27" y="183">0</text>
    <text x="27" y="166.8">0.18</text>
    <text x="27" y="151.5">0.35</text>
    <text x="27" y="93">1.0</text>
  </g>
  <text x="34" y="62" font-size="9" fill="#5A6A79" text-anchor="middle">z [m]</text>

  <!-- ground -->
  <line x1="34" y1="180" x2="452" y2="180" stroke="#101820" stroke-width="1.4"/>

  <!-- robot chassis -->
  <rect x="46" y="156" width="34" height="24" rx="3" fill="#D8DEE6" stroke="#101820" stroke-width="1.2"/>
  <circle cx="55" cy="180" r="5" fill="#101820"/>
  <circle cx="72" cy="180" r="5" fill="#101820"/>
  <circle cx="80" cy="148.5" r="3.2" fill="#C1462B"/>
  <text x="63" y="200" font-size="9" fill="#101820" text-anchor="middle">Nova Carter</text>

  <!-- the scan plane: one horizontal fan at z = 0.35, drawn as the beam that matters -->
  <line x1="80" y1="148.5" x2="300" y2="148.5" stroke="#C1462B" stroke-width="1.8"/>
  <polygon points="300,148.5 292,145.6 292,151.4" fill="#C1462B"/>
  <line x1="80" y1="148.5" x2="452" y2="148.5" stroke="#C1462B" stroke-width="1"
        stroke-dasharray="3 3" opacity="0.45"/>
  <text x="150" y="143" font-size="9.5" fill="#C1462B">raycast_scan(z=0.35) — 수평 팬</text>

  <!-- TRAP: a box whose top is below the plane. Ray sails over it. -->
  <rect x="150" y="163.8" width="70" height="16.2" fill="#F0D9A8" stroke="#101820" stroke-width="1.2"/>
  <text x="185" y="176" font-size="8.5" fill="#101820" text-anchor="middle">h=0.18</text>
  <text x="185" y="196" font-size="9" fill="#101820" text-anchor="middle">박스 06</text>
  <text x="185" y="207" font-size="8.5" fill="#8A5A00" text-anchor="middle">빔이 위로 지나감 → 미검출</text>

  <!-- gap annotation between box top and the plane -->
  <line x1="238" y1="148.5" x2="238" y2="163.8" stroke="#8A5A00" stroke-width="1"/>
  <line x1="234" y1="148.5" x2="242" y2="148.5" stroke="#8A5A00" stroke-width="1"/>
  <line x1="234" y1="163.8" x2="242" y2="163.8" stroke="#8A5A00" stroke-width="1"/>
  <text x="246" y="159" font-size="8.5" fill="#8A5A00">0.17 m 틈</text>

  <!-- VISIBLE: a 1.0 m box. Ray terminates on its face. -->
  <rect x="300" y="90" width="70" height="90" fill="#C7D6E5" stroke="#101820" stroke-width="1.2"/>
  <text x="335" y="140" font-size="8.5" fill="#101820" text-anchor="middle">h=1.0</text>
  <text x="335" y="196" font-size="9" fill="#101820" text-anchor="middle">박스 00</text>
  <text x="335" y="207" font-size="8.5" fill="#1F4B73" text-anchor="middle">빔이 면에서 멈춤 → 검출</text>

  <!-- footnote inside the figure: which boxes are traps -->
  <text x="452" y="70" font-size="8.5" fill="#5A6A79" text-anchor="end">
    평면 아래 박스: 04(0.25) · 05(0.20) · 06(0.18) · 13(0.20)
  </text>
</svg>
